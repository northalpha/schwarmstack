[project]
name = "schwarmstack"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "altcha>=2.5,<3",
    "django>=5.2,<5.3",
    "django-otp>=1.5",
    "gunicorn>=27.0.1",
    "qrcode>=8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
# Django-Testsettings und Pfade kommen mit dem ersten Ticket des Neuaufbaus.
