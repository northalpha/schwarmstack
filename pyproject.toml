[project]
name = "schwarmstack"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "altcha>=2.5,<3",
    "boto3>=1.40",
    "defusedxml>=0.7.1",
    "django>=5.2,<5.3",
    "django-otp>=1.5",
    "gunicorn>=27.0.1",
    "qrcode>=8",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "moto[server]>=5.1",
    "playwright>=1.55",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
    "shellcheck-py>=0.11.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert und feste Testzugangsdaten

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings_test"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["e2e: Durchlauf im echten Browser gegen Garage (braucht scripts/garage.sh start)"]
