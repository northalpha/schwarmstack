[project]
name = "schwarmstack"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "defusedxml>=0.7.1",
    "django>=5.2,<5.3",
    "django-otp>=1.5",
    "gunicorn>=27.0.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.9.0",
    "qrcode>=8",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "actionlint-py>=1.7",
    "moto[server]>=5.1",
    "piexif>=1.1.3",
    "playwright>=1.55",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-timeout>=2.4",
    "ruff>=0.17.6",
    "shellcheck-py>=0.11.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert und feste Testzugangsdaten

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings_test"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
# Ein hängender Test (z. B. ein Speicher, der nie antwortet) bricht mit Traceback ab statt die
# ganze Suite anzuhalten. Einzelne Tests dürfen mit @pytest.mark.timeout(n) länger.
timeout = 60
markers = ["e2e: E2E-Test im echten Browser gegen Garage (braucht scripts/garage.sh start)"]
