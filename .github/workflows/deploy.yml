name: Deploy
# Wird von ci.yml aufgerufen. Alle Werte kommen aus dem GitHub-Environment der Umgebung;
# die Liste steht in docs/betrieb/deployment.md. Freigabe für production im Environment einstellen.
on:
  workflow_call:
    inputs:
      umgebung:
        type: string
        required: true
      image_tag:
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.umgebung }}
      url: https://${{ vars.DOMAIN }}
    # Nie zwei Deploys gleichzeitig auf denselben Host.
    concurrency:
      group: deploy-${{ inputs.umgebung }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: ${{ inputs.image_tag }} nach ${{ inputs.umgebung }}
        run: deploy/deploy.sh
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          # Kurzlebig, nur für diesen Job; der Host behält keinen Zugang zur Registry.
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DOMAIN: ${{ vars.DOMAIN }}
          ADMIN_PATH: ${{ vars.ADMIN_PATH }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ADDRESSING_STYLE: ${{ vars.S3_ADDRESSING_STYLE }}
          UPLOAD_LINK_SECONDS: ${{ vars.UPLOAD_LINK_SECONDS }}
          HSTS_SECONDS: ${{ vars.HSTS_SECONDS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          LOGIN_ATTEMPTS_MAX: ${{ vars.LOGIN_ATTEMPTS_MAX }}
          LOGIN_ATTEMPTS_WINDOW_SECONDS: ${{ vars.LOGIN_ATTEMPTS_WINDOW_SECONDS }}
          CONSENT_TEXT_VERSION: ${{ vars.CONSENT_TEXT_VERSION }}
          COMMUNITY_ORIGINS: ${{ vars.COMMUNITY_ORIGINS }}
          COMMUNITY_CACHE_SECONDS: ${{ vars.COMMUNITY_CACHE_SECONDS }}
          PRIVACY_CONTACT: ${{ vars.PRIVACY_CONTACT }}
          OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          OPERATOR_BEI: ${{ vars.OPERATOR_BEI }}
          OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
          HOSTER_NAME: ${{ vars.HOSTER_NAME }}
          HOSTER_BEI: ${{ vars.HOSTER_BEI }}
          HOSTER_ADDRESS: ${{ vars.HOSTER_ADDRESS }}
          OPERATOR_EMAILS: ${{ vars.OPERATOR_EMAILS }}
          EMAIL_HOST: ${{ vars.EMAIL_HOST }}
          EMAIL_PORT: ${{ vars.EMAIL_PORT }}
          EMAIL_HOST_USER: ${{ vars.EMAIL_HOST_USER }}
          EMAIL_USE_TLS: ${{ vars.EMAIL_USE_TLS }}
          DEFAULT_FROM_EMAIL: ${{ vars.DEFAULT_FROM_EMAIL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_HASH: ${{ secrets.BASIC_AUTH_HASH }}
