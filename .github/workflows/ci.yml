name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Produktion, Rollback, erneuter Deploy: ein schon gebautes Image auf eine Umgebung bringen.
  # Releases baut und veröffentlicht release.yml, sie deployen nichts (ADR 0011).
  workflow_dispatch:
    inputs:
      umgebung:
        description: Umgebung
        type: choice
        options: [staging, production]
        default: staging
      image_tag:
        description: Image-Tag, z. B. sha-1a2b3c4 oder v1.2.0
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/northalpha/schwarmstack

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Browser für den E2E-Test mit Uppy
        run: uv run playwright install --with-deps chromium
      # Lint, Glossar, Changelog, Migrationen und Tests mit Garage und Browser; lokal genauso.
      - run: scripts/pruefen.sh

  # Der Installer-Test läuft nur, wenn sich etwas am Selbstbetrieb ändert (deploy/, also auch
  # setup.sh); der Release-Workflow ruft selbstbetrieb.yml selbst auf (ADR 0011).
  aenderungen:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      selbstbetrieb: ${{ steps.pfade.outputs.selbstbetrieb }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pfade vergleichen
        id: pfade
        env:
          BASIS: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASIS^{commit}" 2>/dev/null; then
            echo "selbstbetrieb=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASIS" "$GITHUB_SHA" \
            | grep -qE '^(deploy/|scripts/selbstbetrieb-test\.sh$|\.github/workflows/selbstbetrieb\.yml$)'; then
            echo "selbstbetrieb=true" >> "$GITHUB_OUTPUT"
          else
            echo "selbstbetrieb=false" >> "$GITHUB_OUTPUT"
          fi

  selbstbetrieb:
    needs: aenderungen
    if: needs.aenderungen.outputs.selbstbetrieb == 'true'
    uses: ./.github/workflows/selbstbetrieb.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag bestimmen
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Image bauen
        run: docker build --tag "$IMAGE:${{ steps.tag.outputs.tag }}" .
      - name: Smoke-Test, /healthz im laufenden Container
        run: |
          docker run --detach --name smoke --publish 8000:8000 \
            --env DJANGO_SECRET_KEY=smoke --env ALLOWED_HOSTS=localhost --env ADMIN_PATH=smoke \
            "$IMAGE:${{ steps.tag.outputs.tag }}"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
      - name: Nach GHCR pushen
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
          docker logout ghcr.io

  staging:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      umgebung: staging
      image_tag: ${{ needs.image.outputs.tag }}
    secrets: inherit

  von-hand:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      umgebung: ${{ inputs.umgebung }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
