name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Produktion, Rollback, erneuter Deploy: ein schon gebautes Image auf eine Umgebung bringen.
  # Releases baut und veröffentlicht release.yml, sie deployen nichts (ADR 0011).
  workflow_dispatch:
    inputs:
      umgebung:
        description: Umgebung
        type: choice
        options: [staging, production]
        default: staging
      image_tag:
        description: Image-Tag, z. B. sha-1a2b3c4 oder v1.2.0
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/northalpha/schwarmstack

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - name: Browser für den E2E-Test mit Uppy
        run: uv run playwright install --with-deps chromium
      # Lint, Glossar, Changelog, Migrationen und Tests mit Garage und Browser; lokal genauso.
      - run: scripts/pruefen.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Der Installer-Test läuft nur, wenn sich etwas am Selbstbetrieb ändert (deploy/, also auch
  # setup.sh); der Release-Workflow ruft selbstbetrieb.yml selbst auf (ADR 0011).
  aenderungen:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      selbstbetrieb: ${{ steps.pfade.outputs.selbstbetrieb }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pfade vergleichen
        id: pfade
        env:
          BASIS: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASIS^{commit}" 2>/dev/null; then
            echo "selbstbetrieb=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASIS" "$GITHUB_SHA" \
            | grep -qE '^(deploy/|scripts/selbstbetrieb-test\.sh$|\.github/workflows/selbstbetrieb\.yml$)'; then
            echo "selbstbetrieb=true" >> "$GITHUB_OUTPUT"
          else
            echo "selbstbetrieb=false" >> "$GITHUB_OUTPUT"
          fi

  selbstbetrieb:
    needs: aenderungen
    if: needs.aenderungen.outputs.selbstbetrieb == 'true'
    uses: ./.github/workflows/selbstbetrieb.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tag bestimmen
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Image bauen
        run: docker build --tag "$IMAGE:${{ steps.tag.outputs.tag }}" .
      - name: Smoke-Test, /healthz im laufenden Container
        run: |
          docker run --detach --name smoke --publish 8000:8000 \
            --env DJANGO_SECRET_KEY=smoke --env ALLOWED_HOSTS=localhost --env ADMIN_PATH=smoke \
            "$IMAGE:${{ steps.tag.outputs.tag }}"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
      # Rot nur bei High/Critical mit vorhandenem Fix; Ausnahmen aus sicherheit-ausnahmen.toml.
      - name: Ausnahmen für Trivy
        run: python3 scripts/ausnahmen.py ids > "$RUNNER_TEMP/trivyignore"
      - name: Trivy, Image prüfen
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ${{ runner.temp }}/trivyignore
      # Alles andere (auch ohne Fix) erscheint als Hinweis im Security-Tab.
      - name: Trivy, Bericht für den Security-Tab
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          format: sarif
          output: trivy.sarif
          trivyignores: ${{ runner.temp }}/trivyignore
      - name: Bericht hochladen
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Nach GHCR pushen
        if: github.event_name == 'push'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
          docker logout ghcr.io

  staging:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      umgebung: staging
      image_tag: ${{ needs.image.outputs.tag }}
    secrets: inherit

  von-hand:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      umgebung: ${{ inputs.umgebung }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
