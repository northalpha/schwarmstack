name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Prüfen
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run pytest -q
      - name: Tarball bauen
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="schwarmstack-${VERSION}"
          mkdir -p "dist/${PKG}"
          cp -r src pyproject.toml uv.lock README.md LICENSE "dist/${PKG}/"
          # Gebaute Frontend-Assets liegen später in frontend/dist (ab A3); auf dem Server ist kein Node nötig.
          if [ -d frontend/dist ]; then mkdir -p "dist/${PKG}/frontend" && cp -r frontend/dist "dist/${PKG}/frontend/"; fi
          find "dist/${PKG}" -name __pycache__ -prune -exec rm -rf {} +
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          (cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256")
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/schwarmstack-${VERSION}.tar.gz" \
            "dist/schwarmstack-${VERSION}.tar.gz.sha256" \
            --title "${GITHUB_REF_NAME}" --generate-notes
