name: Release
# „Merge ist Release“ (ADR 0011): Läuft bei jedem Push auf main, tut aber nur etwas, wenn die Version
# in pyproject.toml größer ist als der letzte Tag. Tag und GitHub Release entstehen als Letztes;
# schlägt ein Schritt davor fehl, gibt es weder Tag noch Release.
on:
  push:
    branches: [main]
  # Probelauf (auch im Fork): baut und prüft alles, pusht nichts, setzt weder Tag noch Release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Probelauf, nichts veröffentlichen
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/northalpha/schwarmstack

concurrency:
  # Je Commit eine Gruppe: ein wartender Release-Lauf wird nie von einem späteren Push verdrängt.
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  erkennen:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.erkennen.outputs.release }}
      version: ${{ steps.erkennen.outputs.version }}
      tags: ${{ steps.erkennen.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
      - id: erkennen
        run: uv run --no-project python scripts/release.py erkennen

  test:
    needs: erkennen
    if: needs.erkennen.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Browser für den E2E-Test mit Uppy
        run: uv run playwright install --with-deps chromium
      # Wie in ci.yml; der Installer-Test läuft als eigener Job „selbstbetrieb“.
      - run: scripts/pruefen.sh

  selbstbetrieb:
    # Installer-Test (#105) vor dem Veröffentlichen.
    needs: erkennen
    if: needs.erkennen.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/selbstbetrieb.yml

  image:
    needs: [erkennen, test, selbstbetrieb]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.erkennen.outputs.version }}
      # Von Hand gestartet pusht nur, wenn kein Probelauf ist und die Version ein Release wäre.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || needs.erkennen.outputs.release != 'true') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Tags bestimmen
        id: tags
        env:
          TAGS: ${{ needs.erkennen.outputs.tags }}
        run: |
          {
            echo "tags<<EOF"
            for t in $TAGS; do echo "$IMAGE:$t"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Image bauen (amd64) für Smoke-Test und Prüfung
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: schwarmstack:pruefen
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-Test, /healthz im laufenden Container
        run: |
          docker run --detach --name smoke --publish 8000:8000 \
            --env DJANGO_SECRET_KEY=smoke --env ALLOWED_HOSTS=localhost --env ADMIN_PATH=smoke \
            schwarmstack:pruefen
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
      - name: Keine .env und keine Zugangsdaten im Image
        run: scripts/image-pruefen.sh schwarmstack:pruefen
      - name: Bei GHCR anmelden
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image für amd64 und arm64 bauen und pushen
        id: push
        if: env.DRY_RUN != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
      - name: Build-Bestätigung (Attestation)
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Prüfsummen
        if: env.DRY_RUN != 'true'
        run: |
          digest=${{ steps.push.outputs.digest }}
          {
            echo "$digest  $IMAGE:v$VERSION (Index)"
            docker buildx imagetools inspect "$IMAGE@$digest" --raw \
              | jq -r --arg image "$IMAGE" '.manifests[]
                  | select(.platform.architecture != "unknown")
                  | "\(.digest)  \($image) \(.platform.os)/\(.platform.architecture)"'
          } | tee pruefsummen.txt
      - uses: actions/upload-artifact@v4
        if: env.DRY_RUN != 'true'
        with:
          name: pruefsummen
          path: pruefsummen.txt

  veroeffentlichen:
    # Erst wenn alles davor grün ist: Tag und GitHub Release.
    needs: [erkennen, image]
    if: github.event_name == 'push' && needs.erkennen.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.erkennen.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: pruefsummen
      - name: Release-Text aus dem Changelog
        run: uv run --no-project python scripts/release.py text "$VERSION" > release-text.md
      - name: Tag setzen und GitHub Release anlegen
        run: |
          gh release create "v$VERSION" pruefsummen.txt \
            --title "v$VERSION" \
            --notes-file release-text.md \
            --target "$GITHUB_SHA"
