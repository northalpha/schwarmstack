# Wöchentlich gruppierte Updates; Sicherheitsupdates kommen sofort und einzeln (ADR 0012).
# Gemergt wird von Hand.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # Django bekommt immer einen eigenen PR: Feature-Releases (5.2, 6.0, 6.1) entfernen
      # Deprecations und brauchen Prüfung (#132). Major-Sprünge kommen nie von selbst.
      django:
        patterns: ["django"]
      python:
        patterns: ["*"]
        exclude-patterns: ["django"]
    ignore:
      - dependency-name: django
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
