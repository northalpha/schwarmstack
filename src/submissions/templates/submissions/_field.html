<div class="{% if field.field.widget.input_type == 'checkbox' %}check{% else %}field{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}{{ field }} {{ field.label_tag }}{% else %}{{ field.label_tag }}{{ field }}{% endif %}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {{ field.errors }}
</div>
