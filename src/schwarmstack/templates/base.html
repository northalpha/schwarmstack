{% load static %}<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Schwarmstack{% endblock %}</title>
  <link rel="icon" href="{% static 'schwarmstack/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'schwarmstack/site.css' %}">
</head>
<body>
  <header class="top"><p class="brand"><img src="{% static 'schwarmstack/mark.svg' %}" alt="" width="30" height="30">Schwarmstack</p></header>
  <main class="{% block mainclass %}page-narrow{% endblock %}">{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
